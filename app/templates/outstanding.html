<!DOCTYPE html>
<html>
<head>
    <title>Outstanding Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Outstanding Balances Report</h1>
    <table class="w-full text-left border-collapse border border-gray-300">
        <thead>
            <tr class="bg-gray-200">
                <th class="border p-2">Roll No</th>
                <th class="border p-2">Name</th>
                <th class="border p-2">Outstanding (₹)</th>
                <th class="border p-2">Action</th>
            </tr>
        </thead>
        <tbody>
            {% for row in report %}
            <tr>
                <td class="border p-2">{{ row.student.roll_no }}</td>
                <td class="border p-2">{{ row.student.name }}</td>
                <td class="border p-2 text-red-600 font-bold">{{ row.balance / 100 }}</td>
                <td class="border p-2"><a href="/ui/ledger/{{ row.student.id }}" class="text-blue-600 underline">View Ledger</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
